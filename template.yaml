AWSTemplateFormatVersion: '2010-09-09'
Description: >
  Secure Serverless API - Step 2: adds an HTTP API Gateway in front of
  the Step 1 Lambda function, reachable over HTTPS.

Resources:

  # --- The user directory ---------------------------------------------------
  # Cognito User Pool: the actual account store - usernames, emails,
  # hashed passwords, verification state. Nothing about auth works until
  # this exists; the pieces after this one just plug into it.
  # AutoVerifiedAttributes/UsernameAttributes: users sign in with their
  # email, and Cognito sends the verification code itself (no email
  # server of our own to set up).
  ItemsUserPool:
    Type: AWS::Cognito::UserPool
    Properties:
      UserPoolName: secure-serverless-api-users
      UsernameAttributes:
        - email
      AutoVerifiedAttributes:
        - email
      Policies:
        PasswordPolicy:
          MinimumLength: 8
          RequireUppercase: true
          RequireLowercase: true
          RequireNumbers: true
          RequireSymbols: false

  # --- The app client --------------------------------------------------
  # Registers this API as an application allowed to use the user pool.
  # ExplicitAuthFlows enables USER_PASSWORD_AUTH so we can test by
  # exchanging an email+password directly for tokens (via the CLI) -
  # simplest flow for learning; a real frontend would typically use the
  # hosted UI / SRP flow instead.
  # GenerateSecret: false because this client is used from a CLI/Postman
  # (a "public" client) - client secrets are for confidential server-side
  # apps that can keep the secret hidden, which doesn't apply here.
  ItemsUserPoolClient:
    Type: AWS::Cognito::UserPoolClient
    Properties:
      ClientName: secure-serverless-api-client
      UserPoolId: !Ref ItemsUserPool
      GenerateSecret: false
      ExplicitAuthFlows:
        - ALLOW_USER_PASSWORD_AUTH
        - ALLOW_REFRESH_TOKEN_AUTH

  # --- The data store ------------------------------------------------------
  # A DynamoDB table needs a primary key defined up front (here, a single
  # partition key "id" of type String - "S"). Unlike a SQL table, you don't
  # declare other columns; any item can carry whatever extra attributes it
  # wants (here, "name").
  # PAY_PER_REQUEST means you pay per read/write with no capacity to plan
  # or scale manually - the right default until you have real traffic
  # patterns to optimize for.
  ItemsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: secure-serverless-api-items
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: id
          AttributeType: S
      KeySchema:
        - AttributeName: id
          KeyType: HASH

  # --- The function's execution role -----------------------------------
  # Every Lambda function needs an IAM role that AWS assumes on its behalf
  # at runtime. This role has two parts:
  #   1. AssumeRolePolicyDocument (the "trust policy") - says WHO is
  #      allowed to assume this role. Here, only the Lambda service.
  #   2. Policies - says WHAT the role is allowed to do once assumed.
  HelloFunctionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: secure-serverless-api-hello-role
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: write-own-logs-only
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                # Scoped to only this function's own log group - not "*".
                # This is what "least privilege" means in practice.
                Resource:
                  - !Sub arn:aws:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/secure-serverless-api-hello:*
        - PolicyName: items-table-read-write
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  # Only the two operations the function actually needs -
                  # not dynamodb:* and not DeleteTable/Scan/etc.
                  - dynamodb:PutItem
                  - dynamodb:GetItem
                # Scoped to this one table's ARN, not "*".
                Resource:
                  - !GetAtt ItemsTable.Arn

  # --- The function itself ----------------------------------------------
  HelloFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: secure-serverless-api-hello
      Runtime: python3.12
      Handler: index.handler
      Role: !GetAtt HelloFunctionRole.Arn
      Timeout: 5
      MemorySize: 128
      # The table's real name is only known at deploy time (CloudFormation
      # may add a suffix, or you may have set TableName explicitly - either
      # way, the function reads it from the environment instead of a
      # hardcoded string, so the template stays the single source of truth.
      Environment:
        Variables:
          TABLE_NAME: !Ref ItemsTable
      # Inline code is getting close to its limit here - once this needs a
      # third route or any real logic, it should move to a separate file.
      # For now it's still small enough to read in one place.
      Code:
        ZipFile: |
          import json
          import os
          import boto3

          dynamodb = boto3.resource("dynamodb")
          table = dynamodb.Table(os.environ["TABLE_NAME"])

          def handler(event, context):
              method = event["requestContext"]["http"]["method"]
              path = event["requestContext"]["http"]["path"]

              if method == "GET" and path == "/hello":
                  return {"statusCode": 200, "body": "Hello from secure-serverless-api"}

              if method == "POST" and path == "/items":
                  body = json.loads(event.get("body") or "{}")
                  item_id = body.get("id")
                  name = body.get("name")
                  if not item_id or not name:
                      return {
                          "statusCode": 400,
                          "body": json.dumps({"error": "id and name are required"})
                      }
                  table.put_item(Item={"id": item_id, "name": name})
                  return {"statusCode": 201, "body": json.dumps({"id": item_id, "name": name})}

              if method == "GET" and path.startswith("/items/"):
                  item_id = event["pathParameters"]["id"]
                  result = table.get_item(Key={"id": item_id})
                  item = result.get("Item")
                  if not item:
                      return {"statusCode": 404, "body": json.dumps({"error": "not found"})}
                  return {"statusCode": 200, "body": json.dumps(item)}

              return {"statusCode": 404, "body": json.dumps({"error": "not found"})}

  # --- The API itself -----------------------------------------------------
  # An HTTP API is just a named container for routes. On its own it does
  # nothing yet - it needs an Integration (below) to tell it where traffic
  # should actually go.
  HttpApi:
    Type: AWS::ApiGatewayV2::Api
    Properties:
      Name: secure-serverless-api
      ProtocolType: HTTP

  # --- The integration -------------------------------------------------
  # This is the wiring between API Gateway and Lambda. AWS_PROXY means
  # "forward the entire raw HTTP request to the function, and return
  # whatever the function responds with" - no request/response transform
  # config needed for a simple case like this.
  # --- The authorizer -----------------------------------------------------
  # A JWT authorizer validates the "Authorization: Bearer <token>" header
  # on incoming requests against Cognito - checking the token's signature,
  # expiry, Issuer (which user pool signed it), and Audience (which app
  # client it was issued for). Any route we attach this to will 401
  # automatically for missing/invalid/expired tokens, before Lambda runs.
  CognitoAuthorizer:
    Type: AWS::ApiGatewayV2::Authorizer
    Properties:
      ApiId: !Ref HttpApi
      AuthorizerType: JWT
      Name: cognito-jwt-authorizer
      IdentitySource:
        - '$request.header.Authorization'
      JwtConfiguration:
        Audience:
          - !Ref ItemsUserPoolClient
        Issuer: !Sub https://cognito-idp.${AWS::Region}.amazonaws.com/${ItemsUserPool}

  HelloIntegration:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId: !Ref HttpApi
      IntegrationType: AWS_PROXY
      IntegrationUri: !GetAtt HelloFunction.Arn
      PayloadFormatVersion: '2.0'

  # --- The route ---------------------------------------------------------
  # Maps a specific method + path to the integration above. Without this,
  # the API has an integration defined but nothing tells it which
  # incoming requests should use it.
  HelloRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref HttpApi
      RouteKey: 'GET /hello'
      Target: !Sub integrations/${HelloIntegration}

  # Two more routes, same pattern as above, both pointing at the same
  # integration - the Lambda code itself branches on method+path to
  # decide what to do (see the handler above).
  # These two now require a valid Cognito token - AuthorizationType/
  # AuthorizerId point them at the authorizer defined above. HelloRoute
  # above is untouched, so /hello stays public for contrast.
  PostItemRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref HttpApi
      RouteKey: 'POST /items'
      Target: !Sub integrations/${HelloIntegration}
      AuthorizationType: JWT
      AuthorizerId: !Ref CognitoAuthorizer

  GetItemRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref HttpApi
      # {id} is a path parameter - API Gateway extracts whatever's in that
      # position and the Lambda reads it via event["pathParameters"]["id"].
      RouteKey: 'GET /items/{id}'
      Target: !Sub integrations/${HelloIntegration}
      AuthorizationType: JWT
      AuthorizerId: !Ref CognitoAuthorizer

  # --- The stage -----------------------------------------------------------
  # A "stage" is a named, deployed snapshot of the API (e.g. dev/prod).
  # AutoDeploy means every change to routes/integrations goes live on
  # this stage automatically - convenient for now, something you'd
  # usually turn off in favor of an explicit release process later.
  HttpApiDefaultStage:
    Type: AWS::ApiGatewayV2::Stage
    Properties:
      ApiId: !Ref HttpApi
      StageName: '$default'
      AutoDeploy: true
      # Applies to every route on this stage (no per-route override needed
      # yet). RateLimit = sustained requests/sec allowed on average;
      # BurstLimit = size of the short-term "bucket" that absorbs spikes
      # above that rate before requests start getting 429'd. These numbers
      # are deliberately low for a learning/test project - a real API's
      # limits would be sized against actual expected traffic.
      DefaultRouteSettings:
        ThrottlingRateLimit: 10
        ThrottlingBurstLimit: 5

  # --- Permission for API Gateway to invoke the Lambda --------------------
  # This is the resource-based policy I mentioned earlier - it lives on
  # the Lambda function itself (not on a role) and says "API Gateway is
  # allowed to invoke me." Without this, API Gateway would return a 500
  # even though everything above looks correctly wired, because Lambda
  # would reject the invocation as unauthorized.
  # SourceArn scopes this down to only THIS api's requests - not "any
  # API Gateway in the account can invoke this function."
  ApiGatewayInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref HelloFunction
      Action: lambda:InvokeFunction
      Principal: apigateway.amazonaws.com
      # Widened from "just /hello" to "any route/method on this API",
      # since /hello, /items, and /items/{id} all now call this same
      # function. Still scoped to this one API's ID - not "*".
      SourceArn: !Sub arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${HttpApi}/*

Outputs:
  HelloFunctionArn:
    Description: ARN of the Hello Lambda function
    Value: !GetAtt HelloFunction.Arn
  HelloFunctionRoleArn:
    Description: ARN of the function's execution role
    Value: !GetAtt HelloFunctionRole.Arn
  HelloUrl:
    Description: Callable HTTPS URL for the /hello route
    Value: !Sub https://${HttpApi}.execute-api.${AWS::Region}.amazonaws.com/hello
  ItemsUrl:
    Description: Base HTTPS URL for the /items routes (POST here, GET {ItemsUrl}/<id>)
    Value: !Sub https://${HttpApi}.execute-api.${AWS::Region}.amazonaws.com/items
  ItemsTableName:
    Description: Name of the DynamoDB table
    Value: !Ref ItemsTable
  UserPoolId:
    Description: Cognito User Pool ID (needed to create a test user)
    Value: !Ref ItemsUserPool
  UserPoolClientId:
    Description: Cognito App Client ID (needed to log in and get a token)
    Value: !Ref ItemsUserPoolClient
